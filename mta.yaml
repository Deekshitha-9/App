_schema-version: 3.3.0
ID: OrderIssuseManagment
description: A simple CAP project.
version: 1.0.0
modules:
  - name: OrderIssuseManagment-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: OrderIssuseManagment-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: OrderIssuseManagment-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: OrderIssuseManagment-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - customer.zip
          name: customer
          target-path: resources/
        - artifacts:
            - order.zip
          name: order
          target-path: resources/
        - artifacts:
            - approver.zip
          name: approver
          target-path: resources/
        - artifacts:
            - custtoorder.zip
          name: custtoorder
          target-path: resources/
        - artifacts:
            - approval.zip
          name: approval
          target-path: resources/
  - name: customer
    type: html5
    path: app/customer
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: OrderIssuseManagment-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: OrderIssuseManagment-db
    parameters:
      buildpack: nodejs_buildpack
  - name: order
    type: html5
    path: app/order
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: approver
    type: html5
    path: app/approver
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: custtoorder
    type: html5
    path: app/custtoorder
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: approval
    type: html5
    path: app/approval
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: OrderIssuseManagment-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: OrderIssuseManagment-html5-service
      service-plan: app-host
  - name: OrderIssuseManagment-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: OrderIssuseManagment-destination-service
      service-plan: lite
  - name: OrderIssuseManagment-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
